# Builds lofilife for WebGL, Windows and macOS on GitHub's machines on every push, keeps both builds as
# downloads on the run page, and pushes main builds to the itch.io playtest page. Main updates the
# "Early Access" GitHub pre-release; the release branch publishes a new versioned GitHub release.
# Setup: docs/CI-SETUP.md
name: Playtest build

on:
  push:
    branches: [main, release]
    paths-ignore: ['BrowserExtension/**', 'docs/**', '**.md'] # nothing in the game changed
  workflow_dispatch:

concurrency:
  group: playtest-build-${{ github.ref }}
  cancel-in-progress: false # let a running build finish; GitHub keeps only the newest waiting push

jobs:
  # Skips the build (instead of failing and emailing) until the Unity licence secret is added.
  licence:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No UNITY_LICENSE secret yet, so nothing was built. See docs/CI-SETUP.md."; fi

  build:
    name: Build ${{ matrix.name }}
    needs: licence
    if: needs.licence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            name: WebGL
            output: build/WebGL/lofilife # index.html must sit at the root of what itch gets
            channel: playtest-web
          - targetPlatform: StandaloneWindows64
            name: Windows
            output: build/StandaloneWindows64
            channel: playtest-windows
    steps:
      # The Unity image plus Library don't fit in the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: lofilife
          versioning: None # keep the bundleVersion set in Player Settings

      - name: Drop files that must not ship
        run: sudo rm -rf build/*/*_BurstDebugInformation_DoNotShip

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.output }}
          retention-days: 14

      - name: Push to itch.io
        if: github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || 'macronnie/lofilife-playtest' }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret, skipping itch.io"; exit 0; fi
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler push "${{ matrix.output }}" "$ITCH_TARGET:${{ matrix.channel }}" \
            --userversion "0.1.${{ github.run_number }}-${GITHUB_SHA::7}"

  # The Mac app is its own job and its own GitHub release, so Mac and Windows ship independently.
  # One universal app (Apple silicon + Intel), ad-hoc signed here because Apple silicon won't run unsigned code.
  # Not notarized: players open it once via System Settings > Privacy & Security > Open Anyway.
  mac:
    name: Build macOS
    needs: licence
    if: needs.licence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneOSX-

      - uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildMethod: ShipSetupTools.BuildMac # sets the universal architecture, writes Builds/macOS/lofilife.app
          versioning: None

      - name: Ad-hoc sign and zip
        run: |
          sudo chown -R "$USER" Builds
          rm -rf Builds/macOS/*_BurstDebugInformation_DoNotShip
          curl -sSfL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign sign Builds/macOS/lofilife.app
          # zip keeps the executable bit and symlinks; a plain artifact upload would drop them and break the app
          (cd Builds/macOS && zip -qry ../../lofilife-mac.zip lofilife.app)

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-macOS-${{ github.run_number }}
          path: lofilife-mac.zip
          retention-days: 14

      - name: Push to itch.io
        if: github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || 'macronnie/lofilife-playtest' }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret, skipping itch.io"; exit 0; fi
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler push Builds/macOS "$ITCH_TARGET:playtest-mac" \
            --userversion "0.1.${{ github.run_number }}-${GITHUB_SHA::7}"

      - name: Publish Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          mv lofilife-mac.zip "lofilife-$version-mac.zip"
          if [ "$GITHUB_REF_NAME" = main ]; then
            gh release delete mac-early-access --yes --cleanup-tag || true
            gh release create mac-early-access "lofilife-$version-mac.zip" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Mac Early Access (build $RUN)" \
              --notes "Newest Mac build from main, $(date -u +%Y-%m-%d). Unfinished and may have bugs. First launch: open it, then System Settings > Privacy & Security > Open Anyway."
          elif [ "$GITHUB_REF_NAME" = release ]; then
            gh release create "v$version-mac.$RUN" "lofilife-$version-mac.zip" --latest=false --target "$GITHUB_SHA" \
              --title "lofilife $version for Mac (build $RUN)" --generate-notes
          fi

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings

      - uses: actions/download-artifact@v4
        with:
          pattern: lofilife-*-${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          (cd "lofilife-WebGL-$RUN" && zip -qr "../lofilife-$version-web.zip" .)
          (cd "lofilife-Windows-$RUN" && zip -qr "../lofilife-$version-windows.zip" .)
          files="lofilife-$version-web.zip lofilife-$version-windows.zip"
          if [ "$GITHUB_REF_NAME" = main ]; then
            # One rolling pre-release that always holds the newest main build.
            gh release delete early-access --yes --cleanup-tag || true
            gh release create early-access $files --prerelease --target "$GITHUB_SHA" \
              --title "Early Access (build $RUN)" \
              --notes "Newest build from main, $(date -u +%Y-%m-%d). Unfinished and may have bugs."
          else
            gh release create "v$version-build.$RUN" $files --target "$GITHUB_SHA" --latest \
              --title "lofilife $version (build $RUN)" --generate-notes
          fi
