# Builds lofilife for WebGL, Windows and macOS on GitHub's machines on every push, all from the same commit
# and stamped with the same version label (shown in the main menu), and keeps the builds as downloads on the
# run page. Main updates the "Early Access" pre-releases and the itch.io playtest page; the release branch
# publishes new versioned GitHub releases and, once ITCH_RELEASE_TARGET is set, the public itch.io page.
# Setup: docs/CI-SETUP.md
name: Playtest build

on:
  push:
    branches: [main, release]
    paths-ignore: ['BrowserExtension/**', 'docs/**', '**.md'] # nothing in the game changed
  workflow_dispatch:

concurrency:
  group: playtest-build-${{ github.ref }}
  cancel-in-progress: false # let a running build finish; GitHub keeps only the newest waiting push

jobs:
  # Skips the build (instead of failing and emailing) until the Unity licence secret is added.
  licence:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings

      # One version for every platform in this run: Player Settings version + run number + commit.
      - id: version
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=build ${{ github.run_number }} (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No UNITY_LICENSE secret yet, so nothing was built. See docs/CI-SETUP.md."; fi

  build:
    name: Build ${{ matrix.name }}
    needs: licence
    if: needs.licence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            name: WebGL
            output: build/WebGL/lofilife # index.html must sit at the root of what itch gets
            channel: web
          - targetPlatform: StandaloneWindows64
            name: Windows
            output: build/StandaloneWindows64
            channel: windows
    steps:
      # The Unity image plus Library don't fit in the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Stamp version
        run: echo "${{ needs.licence.outputs.label }}" > Assets/Resources/BuildInfo.txt

      # The editor is sometimes SIGKILLed (exit 137) just after loading a restored Library;
      # every run with a fresh Library has built, so one retry starts from an empty Library.
      - id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: lofilife
          versioning: None # keep the bundleVersion set in Player Settings

      - name: Clear Library after a failed build
        if: steps.build.outcome == 'failure'
        run: sudo rm -rf Library

      - if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: lofilife
          versioning: None # keep the bundleVersion set in Player Settings

      - name: Drop files that must not ship
        run: sudo rm -rf build/*/*_BurstDebugInformation_DoNotShip

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.output }}
          retention-days: 14

      # main -> playtest page (playtest-<platform> channels); release -> public page, only once ITCH_RELEASE_TARGET is set.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TARGET: ${{ github.ref == 'refs/heads/main' && (vars.ITCH_TARGET || 'macronnie/lofilife-playtest') || (github.ref == 'refs/heads/release' && vars.ITCH_RELEASE_TARGET || '') }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'playtest-' || '' }}${{ matrix.channel }}
          USERVERSION: ${{ needs.licence.outputs.version }}+${{ github.run_number }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$TARGET" ]; then echo "itch.io not set up for $GITHUB_REF_NAME, skipping"; exit 0; fi
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler push "${{ matrix.output }}" "$TARGET:$CHANNEL" --userversion "$USERVERSION"

  # The Mac app is its own job and its own GitHub release, so Mac and Windows ship independently.
  # One universal app (Apple silicon + Intel), ad-hoc signed here because Apple silicon won't run unsigned code.
  # Not notarized: players open it once via System Settings > Privacy & Security > Open Anyway.
  mac:
    name: Build macOS
    needs: licence
    if: needs.licence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneOSX-

      - name: Stamp version
        run: echo "${{ needs.licence.outputs.label }}" > Assets/Resources/BuildInfo.txt

      # The editor is sometimes SIGKILLed (exit 137) just after loading a restored Library;
      # every run with a fresh Library has built, so one retry starts from an empty Library.
      - id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildMethod: ShipSetupTools.BuildMac # sets the universal architecture, writes Builds/macOS/lofilife.app
          versioning: None

      - name: Clear Library after a failed build
        if: steps.build.outcome == 'failure'
        run: sudo rm -rf Library

      - if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildMethod: ShipSetupTools.BuildMac # sets the universal architecture, writes Builds/macOS/lofilife.app
          versioning: None

      - name: Ad-hoc sign and zip
        run: |
          sudo chown -R "$USER" Builds
          rm -rf Builds/macOS/*_BurstDebugInformation_DoNotShip
          curl -sSfL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          rc=apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          # Unity's dylibs carry entitlements ending in a stray quote ('</plist>"') that rcodesign can't parse; same-length fix
          grep -rl '</plist>"' Builds/macOS/lofilife.app | xargs -r perl -0777 -pi -e 's{</plist>"}{</plist>\n}g'
          # Unity's own signatures still run, so a signing failure warns instead of dropping the release
          $rc sign Builds/macOS/lofilife.app || echo "::warning::Ad-hoc signing failed, so the Mac app keeps Unity's own signatures."
          # zip keeps the executable bit and symlinks; a plain artifact upload would drop them and break the app
          (cd Builds/macOS && zip -qry ../../lofilife-mac.zip lofilife.app)

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-macOS-${{ github.run_number }}
          path: lofilife-mac.zip
          retention-days: 14

      # main -> playtest page (playtest-<platform> channels); release -> public page, only once ITCH_RELEASE_TARGET is set.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TARGET: ${{ github.ref == 'refs/heads/main' && (vars.ITCH_TARGET || 'macronnie/lofilife-playtest') || (github.ref == 'refs/heads/release' && vars.ITCH_RELEASE_TARGET || '') }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'playtest-' || '' }}mac
          USERVERSION: ${{ needs.licence.outputs.version }}+${{ github.run_number }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$TARGET" ]; then echo "itch.io not set up for $GITHUB_REF_NAME, skipping"; exit 0; fi
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler push "Builds/macOS" "$TARGET:$CHANNEL" --userversion "$USERVERSION"

      - name: Publish Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          version: ${{ needs.licence.outputs.version }}
        run: |
          mv lofilife-mac.zip "lofilife-$version-mac.zip"
          if [ "$GITHUB_REF_NAME" = main ]; then
            gh release delete mac-early-access --yes --cleanup-tag || true
            gh release create mac-early-access "lofilife-$version-mac.zip" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Mac Early Access (build $RUN)" \
              --notes "Newest Mac build from main, $(date -u +%Y-%m-%d). Unfinished and may have bugs. First launch: open it, then System Settings > Privacy & Security > Open Anyway."
          elif [ "$GITHUB_REF_NAME" = release ]; then
            gh release create "v$version-mac.$RUN" "lofilife-$version-mac.zip" --latest=false --target "$GITHUB_SHA" \
              --title "lofilife $version for Mac (build $RUN)" --generate-notes
          fi

  github-release:
    needs: [licence, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: BrowserExtension

      - uses: actions/download-artifact@v4
        with:
          pattern: lofilife-*-${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          version: ${{ needs.licence.outputs.version }}
        run: |
          (cd "lofilife-WebGL-$RUN" && zip -qr "../lofilife-$version-web.zip" .)
          (cd "lofilife-Windows-$RUN" && zip -qr "../lofilife-$version-windows.zip" .)
          # The extension from the same commit, for loading unpacked; the Chrome Web Store copy comes from extension.yml.
          ext=$(jq -r .version BrowserExtension/manifest.json)
          (cd BrowserExtension && zip -qr "../lofilife-focus-$ext.zip" . -x 'store/*' 'tests/*' 'README.md')
          files="lofilife-$version-web.zip lofilife-$version-windows.zip lofilife-focus-$ext.zip"
          if [ "$GITHUB_REF_NAME" = main ]; then
            # One rolling pre-release that always holds the newest main build.
            gh release delete early-access --yes --cleanup-tag || true
            gh release create early-access $files --prerelease --target "$GITHUB_SHA" \
              --title "Early Access (build $RUN)" \
              --notes "Newest build from main, $(date -u +%Y-%m-%d). Unfinished and may have bugs."
          else
            gh release create "v$version-build.$RUN" $files --target "$GITHUB_SHA" --latest \
              --title "lofilife $version (build $RUN)" --generate-notes
          fi
