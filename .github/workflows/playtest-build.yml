# Builds lofilife for WebGL and Windows on ronnie's own PC (a self-hosted GitHub runner, so it uses the
# Unity that is already installed and signed in there), keeps both builds as downloads on the run page,
# and pushes them to the itch.io playtest page. Setup: docs/CI-SETUP.md
name: Playtest build

on:
  push:
    branches: [main] # never pull_request: on a public repo that would let anyone's PR run code on the PC
  workflow_dispatch:

concurrency:
  group: playtest-build
  cancel-in-progress: true # a newer push makes the running build pointless

jobs:
  build:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep Library between runs so only changed assets re-import

      - name: Build WebGL and Windows
        run: |
          $version = (Select-String 'm_EditorVersion: (.+)' ProjectSettings/ProjectVersion.txt).Matches[0].Groups[1].Value
          $unity = if ($env:UNITY_PATH) { $env:UNITY_PATH } else { "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe" }
          if (-not (Test-Path $unity)) { throw "Unity $version not found at $unity. Set the UNITY_PATH repo variable." }
          Remove-Item Builds -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($method in 'ShipSetupTools.BuildWeb', 'ShipSetupTools.BuildWindows') {
            $log = "$method.log"
            $p = Start-Process $unity -Wait -PassThru -NoNewWindow -ArgumentList '-batchmode', '-quit', '-projectPath', "`"$PWD`"", '-executeMethod', $method, '-logFile', "`"$PWD\$log`""
            Get-Content $log -Tail 40
            if ($p.ExitCode -ne 0) { throw "$method failed (exit $($p.ExitCode)). Full log is in the build-logs download." }
          }
          Remove-Item Builds/Windows/*_BurstDebugInformation_DoNotShip -Recurse -Force -ErrorAction SilentlyContinue
        env:
          UNITY_PATH: ${{ vars.UNITY_PATH }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: '*.log'
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-WebGL-${{ github.run_number }}
          path: Builds/WebGL
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: lofilife-Windows-${{ github.run_number }}
          path: Builds/Windows
          retention-days: 14

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || 'macronnie/lofilife-playtest' }}
        run: |
          if (-not $env:BUTLER_API_KEY) { Write-Output "No BUTLER_API_KEY secret, skipping itch.io"; exit 0 }
          Invoke-WebRequest https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler -Force
          $v = "0.1.${{ github.run_number }}-$($env:GITHUB_SHA.Substring(0,7))"
          butler\butler.exe push Builds/WebGL "$($env:ITCH_TARGET):playtest-web" --userversion $v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          butler\butler.exe push Builds/Windows "$($env:ITCH_TARGET):playtest-windows" --userversion $v
          exit $LASTEXITCODE
