<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Back to studying · lofilife</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page blocked">
  <main class="card">
    <img src="icons/icon128.png" alt="" width="64" height="64">
    <h2 id="title">Back to studying</h2>
    <p id="why"><strong id="site">This site</strong> is blocked until your study session ends.</p>
    <div id="clock" class="big-time" hidden></div>
    <div class="actions">
      <a id="back" class="btn primary" hidden></a>
      <button id="pass" class="btn" hidden>Open it anyway for 5 minutes</button>
    </div>
    <p id="hint" class="muted small">You can change blocking in the lofilife extension, on the Blocking tab.</p>
  </main>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
