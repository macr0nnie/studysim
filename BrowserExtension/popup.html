<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lofilife</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" class="logo" width="28" height="28">
    <h1>lofilife</h1>
    <span id="pill" class="pill" role="status">Connecting</span>
  </header>

  <section id="timer" class="card" hidden>
    <div id="phase" class="phase">Study</div>
    <div id="clock" class="clock" aria-live="off">--:--</div>
    <div id="mode" class="muted center"></div>
    <div id="distracted" class="alert" hidden>You're on a distracting site. Your room is falling apart!</div>
    <div class="row">
      <button id="toggle" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <form id="setForm" class="row set">
      <label class="inline"><input id="minutes" type="number" min="5" max="120" value="25" aria-label="Study length in minutes"> min</label>
      <button type="submit">Set length</button>
    </form>
  </section>

  <section id="offline" class="card offline" hidden>
    <p class="big">Open lofilife to connect</p>
    <p class="muted small">This extension works with the lofilife desktop game on this computer. Start the game and it connects by itself.</p>
  </section>

  <details class="card">
    <summary>Sites and blocking</summary>
    <label for="block">Block distracting sites</label>
    <select id="block">
      <option value="off">Never</option>
      <option value="strict">During strict focus sessions</option>
      <option value="always">During every study session</option>
    </select>
    <label for="distracting">Distracting sites, one per line</label>
    <textarea id="distracting" rows="5" spellcheck="false"></textarea>
    <label for="study">Study sites, one per line (they earn focus XP)</label>
    <textarea id="study" rows="4" spellcheck="false"></textarea>
    <button id="save" class="primary wide">Save</button>
    <div id="saved" class="muted small center" role="status"></div>
  </details>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
